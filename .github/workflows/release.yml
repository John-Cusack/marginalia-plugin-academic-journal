name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry run to TestPyPI. Publishing to production PyPI happens only on a version tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_VERSION: "0.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11

      - name: Tag, package version, and changelog must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run python -c 'import acad; print(acad.__version__)')"
          test "$TAG" = "$VERSION" || { echo "tag $GITHUB_REF_NAME != version $VERSION"; exit 1; }
          grep -q "^## ${VERSION} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${VERSION}' section"; exit 1; }

      - run: uv sync --extra dev
      - run: uv run ruff check acad tests
      - run: uv run pytest tests/unit tests/contract -q

      - run: uv build --out-dir dist
      - run: uvx --from twine twine check --strict dist/*
      - run: uv run --extra dev --with packaging pytest tests/artifact -q
        env:
          ACAD_DIST_DIR: dist

      - name: Clean-environment install beside core
        run: |
          python -m venv /tmp/acad-release-smoke
          /tmp/acad-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/acad-release-smoke/bin/python -m pip install "marginalia-ai==${CORE_VERSION}" dist/*.whl
          /tmp/acad-release-smoke/bin/python -c "from research_engine.plugins.discovery import discover_plugins; assert 'academic-journal' in [p.plugin_id for p in discover_plugins()]"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Trusted Publisher: marginalia-ai-plugin-academic-journal on test.pypi.org,
    # workflow release.yml, environment testpypi.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A protected environment: publishing waits for its reviewers.
    # Trusted Publisher: marginalia-ai-plugin-academic-journal on pypi.org,
    # workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      # Trusted Publishing only, on this job only. No API token secret exists.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      # Pinned to a reviewed commit (v1.14.2). PEP 740 attestations stay on by default,
      # and skip-existing stays off so a duplicate upload fails loudly.
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26
        with:
          packages-dir: dist/
