[project]
name = "research-engine-plugin-academic-journal"
dynamic = ["version"]
description = "Academic literature discovery, acquisition, and citation-graph plugin for Research Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MarginaliaAI" }]
keywords = ["citations", "crossref", "openalex", "research-engine", "scholarly-literature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "research-engine-sdk>=0.6,<0.7",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    # acad.filters builds the filter-extension clause core composes into search.
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[dependency-groups]
# Core is never a runtime dependency of the plugin. Integration tests install the exact
# core artifact the plugin is proven against; testcontainers supplies a disposable
# PostgreSQL when ACAD_TEST_DATABASE_URL is not set.
integration = [
    "research-engine[documents]==0.6.0",
    "testcontainers[postgres]>=4,<5",
    # testcontainers' readiness probe speaks psycopg2; the plugin itself uses asyncpg.
    "psycopg2-binary>=2.9,<3",
]

[project.entry-points."research_engine.plugins"]
academic-journal = "acad"

[project.urls]
Homepage = "https://github.com/John-Cusack/marginalia-plugin-academic-journal"
Source = "https://github.com/John-Cusack/marginalia-plugin-academic-journal"
Issues = "https://github.com/John-Cusack/marginalia-plugin-academic-journal/issues"
Changelog = "https://github.com/John-Cusack/marginalia-plugin-academic-journal/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "acad/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acad"]

[tool.hatch.build.targets.sdist]
include = ["acad", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: needs PostgreSQL and the research-engine core artifact",
    "live: calls real provider APIs; opt in with ACAD_LIVE_TESTS=1",
    "artifact: inspects built wheel/sdist files in ACAD_DIST_DIR",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Pydantic evaluates these annotations at runtime, so the imports must stay at module
# scope; and `str, Enum` members must keep stringifying as they do in the database.
"acad/models.py" = ["TC003", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["acad"]
