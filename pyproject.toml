[project]
name = "marginalia-plugin-academic-journal"
version = "0.1.0"
description = "Academic literature discovery and ingestion plugin for Corpus Engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
