name: academic-journal
version: "0.1.0"
author: MarginaliaAI
description: Academic literature discovery, acquisition, and ingestion pipeline
license: MIT

requires:
  core_api: ">=0.1.0,<1.0.0"
  python: ">=3.11"
  pip:
    - httpx>=0.27
    - asyncpg>=0.29

permissions:
  network: egress
  network_allowlist:
    - api.openalex.org
    - api.semanticscholar.org
    - api.crossref.org
    - api.unpaywall.org
    - arxiv.org
    - api.core.ac.uk
    - eutils.ncbi.nlm.nih.gov
    - www.ncbi.nlm.nih.gov
  llm: false
  ingest: true
  filesystem: read_write_plugin_data

provides:
  filter_extensions:
    - id: academic_paper
      entry: "acad.filters:AcademicPaperFilter"
      description: "Filter passages from academic papers by year, venue, citation count, or open access status"

  source_search:
    - id: acad
      entry: "acad.source_search:AcadSourceSearchProvider"
      description: "Discover academic papers across OpenAlex/Crossref for the unified search_sources tool"

  extraction_schemas:
    - id: bibliography_references
      version: 1
      file: schemas/extraction_schemas/bibliography_references.yaml

  mcp_tools:
    - id: acad.discover_papers
      entry: "acad.tools.discover_papers:handler"
      description: Search OpenAlex/S2/Crossref for papers by query
    - id: acad.discover_by_doi
      entry: "acad.tools.discover_by_doi:handler"
      description: Look up a single paper by DOI
    - id: acad.discover_by_author
      entry: "acad.tools.discover_by_author:handler"
      description: Find papers by author name or OpenAlex author ID
    - id: acad.pipeline_status
      entry: "acad.tools.pipeline_status:handler"
      description: Show papers by stage, queue depths, and errors
    - id: acad.search_papers
      entry: "acad.tools.search_papers:handler"
      description: Search ingested academic papers
    - id: acad.retry_failed
      entry: "acad.tools.retry_failed:handler"
      description: Re-enqueue failed pipeline jobs
    - id: acad.import_manual_pdf
      entry: "acad.tools.import_manual_pdf:handler"
      description: Import a manually downloaded PDF for a paper
    - id: acad.start_workers
      entry: "acad.tools.start_workers:handler"
      description: Launch background pipeline workers

  post_ingestion_hooks:
    - id: acad.citation_hook
      entry: "acad.hooks.citation_hook:handler"
      event: post_ingestion
